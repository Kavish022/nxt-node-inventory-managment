name: Backend CI

on:
  push:
    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-test-and-build:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: inventory_management_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    defaults:
      run:
        working-directory: backend-node

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend-node/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "mysql://root:rootpassword@127.0.0.1:3306/inventory_management_db"
        run: npx prisma generate

      - name: Push Schema to Ephemeral DB
        env:
          DATABASE_URL: "mysql://root:rootpassword@127.0.0.1:3306/inventory_management_db"
        run: npx prisma db push --skip-generate

      - name: Run TypeScript Check (Lint)
        run: npm run lint

      - name: Run Test Suite
        env:
          DATABASE_URL: "mysql://root:rootpassword@127.0.0.1:3306/inventory_management_db"
          JWT_SECRET: "test_jwt_secret_ci_key_12345678"
          JWT_REFRESH_SECRET: "test_refresh_secret_ci_key_12345678"
          PORT: 5001
        run: npm test

      - name: Build TypeScript Project
        run: npm run build
